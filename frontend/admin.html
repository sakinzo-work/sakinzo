<script>
const API_BASE = window.API_BASE || 'https://sakinzo.onrender.com/api';
const API_ORIGIN = API_BASE.replace('/api','');
const TOKEN_KEY = 'sakinzo_admin_token';
const THEME_KEY = 'sakinzo_admin_theme';
const SIDEBAR_KEY = 'sakinzo_admin_sidebar_collapsed';
const navGroups = [
  ['Overview', [['dashboard','Dashboard']]],
  ['Content', [['projects','Projects'], ['blogs','Blogs'], ['insights','Insights']]],
  ['People', [['clients','Clients'], ['team','Team'], ['testimonials','Testimonials']]],
  ['Website', [['contactPage','Contact Page'], ['stats','Stats'], ['mapLocations','Client Map'], ['whatWeDoServices','What We Do'], ['sections','Sections']]],
  ['Access', [['admins','Employees']]]
];
const navItems = navGroups.flatMap(group => group[1]);
const endpoints = { projects:'projects', blogs:'blogs', insights:'insights', clients:'clients', team:'team', testimonials:'testimonials', stats:'stats', mapLocations:'map-locations', contactOffices:'contact-offices', admins:'admins' };
let data = { projects:[], blogs:[], insights:[], clients:[], team:[], testimonials:[], stats:[], mapLocations:[], contactOffices:[], contactPage:{}, whatWeDoServices:[], sections:[], submissions:[], admins:[] };
let currentAdmin = null;
let currentPage = 'dashboard';
let editing = null;
let employeeQuery = '';
let realtimeTimer = null;
let lastSyncedAt = null;
let dashboardRange = '7D';

const $ = id => document.getElementById(id);
const token = () => sessionStorage.getItem(TOKEN_KEY);
const esc = (v='') => String(v).replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
const mediaUrl = url => url && url.startsWith('/uploads/') ? API_ORIGIN + url : url;
const fmtDate = value => value ? new Date(value).toLocaleString() : '-';
const mailtoUrl = s => `mailto:${encodeURIComponent(s.email || '')}?subject=${encodeURIComponent('Reply from Sakinzo')}&body=${encodeURIComponent(`Hi ${s.name || ''},\n\nThank you for contacting Sakinzo.\n\n`)}`;
const whatsappUrl = phone => {
  const digits = String(phone || '').replace(/\D/g, '');
  return digits ? `https://wa.me/${digits}` : '';
};
function applyTheme(theme=localStorage.getItem(THEME_KEY)||'dark'){
  document.documentElement.dataset.theme = theme;
  const icon=$('themeIcon');
  const button=$('themeToggle');
  if(button)button.setAttribute('aria-label',theme==='light'?'Switch to dark theme':'Switch to light theme');
  if(icon)icon.innerHTML = theme==='light'
    ? '<path d="M21 12.8A8.4 8.4 0 0 1 11.2 3a7 7 0 1 0 9.8 9.8z"/>'
    : '<path d="M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M3 12h2M19 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="4"/>';
}
window.toggleTheme=function(){const next=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem(THEME_KEY,next);applyTheme(next);};
applyTheme();
function applySidebarState(collapsed=localStorage.getItem(SIDEBAR_KEY)==='true'){
  document.body.classList.toggle('sidebar-collapsed',collapsed);
}
window.toggleSidebar=function(forceCollapsed){
  const collapsed=typeof forceCollapsed==='boolean'?forceCollapsed:!document.body.classList.contains('sidebar-collapsed');
  localStorage.setItem(SIDEBAR_KEY,String(collapsed));
  applySidebarState(collapsed);
};
applySidebarState();
function updateHeaderUser(){
  const el=$('topbarUser');
  if(!el||!currentAdmin)return;
  const name=currentAdmin.name||currentAdmin.email||'Admin';
  const initials=String(name).split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'A';
  const id=currentAdmin.employeeId||currentAdmin.email||currentAdmin._id||'Admin account';
  el.innerHTML=`<div class="topbar-avatar">${esc(initials)}</div><div><strong>${esc(name)}</strong><span>${esc(id)} · ${esc(currentAdmin.role||'admin')}</span></div>`;
}
function updateSyncStatus(){
  const el=$('syncStatus');
  if(!el)return;
  if(!lastSyncedAt){el.textContent='Live';return;}
  el.textContent=`Live · ${lastSyncedAt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
}
function startRealtime(){
  clearInterval(realtimeTimer);
  realtimeTimer=setInterval(()=>{if(token()&&document.visibilityState==='visible'&&!editing)loadAll({silent:true});},20000);
}

async function api(path, opts={}){ const res = await fetch(`${API_BASE}${path}`, { ...opts, headers: { 'Content-Type':'application/json', ...(opts.headers||{}), ...(token()?{Authorization:`Bearer ${token()}`}:{}) } }); const json = await res.json().catch(()=>({})); if(!res.ok){ if(res.status===401 && token() && path!=='/auth/login') logout(); throw new Error(json.message || 'Request failed'); } return json; }
async function optimizeImageFile(file){ if(!file||!file.type?.startsWith('image/')||/svg|gif/i.test(file.type))return file; if(file.size<=900*1024)return file; const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);}); const img=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=dataUrl;}); const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)); const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height); const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.82)); return blob||file; }
async function uploadImageFile(file){ if(!file)return ''; const prepared=await optimizeImageFile(file); const fd=new FormData(); fd.append('file',prepared,file.name?.replace(/\.[^.]+$/,'.jpg')||'image.jpg'); const res=await fetch(`${API_BASE}/upload`,{method:'POST',headers:{Authorization:`Bearer ${token()}`},body:fd}); const json=await res.json(); if(!res.ok)throw new Error(json.message||'Upload failed'); return json.url; }
async function uploadFile(inputId){ const file = $(inputId)?.files?.[0]; return uploadImageFile(file); }

async function loadAll(options={}){ const silent=options.silent===true; try { const me=await api('/auth/me'); currentAdmin=me.admin; updateHeaderUser(); if(currentAdmin.role==='employee'){const adminResult=await api('/admins').then(rows=>({rows,available:true})).catch(err=>{if(/route not found/i.test(err.message))return {rows:[],available:false};throw err;}); data={projects:[],blogs:[],insights:[],clients:[],team:[],testimonials:[],stats:[],mapLocations:[],contactOffices:[],contactPage:{},sections:[],whatWeDoServices:[],submissions:[],admins:adminResult.rows,adminUsersAvailable:adminResult.available}; currentPage='admins'; buildNav(); lastSyncedAt=new Date(); updateSyncStatus(); if(!silent)notify('Data loaded'); render(); return;} const adminsRequest=api('/admins').then(rows=>({rows,available:true})).catch(err=>{if(/route not found/i.test(err.message))return {rows:[],available:false};throw err;}); const contactPageRequest=api('/contact-page').catch(err=>{if(/route not found/i.test(err.message))return {};throw err;}); const blogsRequest=api('/blogs/admin/all').catch(err=>{if(/route not found/i.test(err.message))return [];throw err;}); const [projects,blogs,insights,clients,team,testimonials,stats,mapLocations,contactOffices,contactPage,sections,whatWeDoServices,submissions,adminResult] = await Promise.all([api('/projects/admin/all'),blogsRequest,api('/insights/admin/all'),api('/clients/admin/all'),api('/team/admin/all'),api('/testimonials/admin/all'),api('/stats/admin/all'),api('/map-locations/admin/all'),api('/contact-offices/admin/all'),contactPageRequest,api('/sections'),api('/what-we-do-services'),api('/submissions'),adminsRequest]); data={projects,blogs,insights,clients,team,testimonials,stats,mapLocations,contactOffices,contactPage,sections,whatWeDoServices,submissions,admins:adminResult.rows,adminUsersAvailable:adminResult.available}; buildNav(); updateHeaderUser(); lastSyncedAt=new Date(); updateSyncStatus(); if(!silent)notify('Data loaded'); render(); } catch(err){ console.error(err); if(!silent)alert(err.message); } }

window.renderGlobalSearch=function(){const input=$('globalSearch'),box=$('searchResults');if(!input||!box)return;const q=input.value.trim().toLowerCase();if(!q){box.classList.remove('open');box.innerHTML='';return;}const rows=[];searchableCollections().forEach(([type,label])=>(data[type]||[]).forEach(item=>{if(searchText(item).includes(q))rows.push({type,label,item});}));box.innerHTML=rows.slice(0,8).map((row,index)=>`<button class="search-result" type="button" data-index="${index}" onclick="openSearchResult('${row.type}','${row.item._id||''}')"><strong>${esc(resultTitle(row.item))}</strong><span>${esc(row.label)} · ${esc(row.item.category||row.item.role||row.item.email||row.item.city||'Open section')}</span></button>`).join('')||'<div class="search-result"><strong>No results found</strong><span>Try project name, client, email, category or location</span></div>';box.classList.add('open');};

function iconSvg(type){return ({projects:'<svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>',insights:'<svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-4 12.7V19h8v-3.3A7 7 0 0 0 12 3z"/><path d="M9 22h6"/></svg>',clients:'<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.8M16 3.2a4 4 0 0 1 0 7.6"/></svg>',team:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4"/><path d="M2 21a6 6 0 0 1 12 0M17 11a4 4 0 1 0 0-8M16 21a6 6 0 0 1 6-6"/></svg>',testimonials:'<svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg>',chart:'<svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 3 5-7"/></svg>',clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>',bolt:'<svg viewBox="0 0 24 24"><path d="m13 2-9 13h7l-1 7 10-14h-7z"/></svg>'}[type]||'');}
function sparkline(color){return `<svg viewBox="0 0 100 56"><defs><linearGradient id="sg-${color.replace('#','')}" x1="0" x2="0" y1="0" y2="1"><stop stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="M0 45 C12 20 22 36 34 22 S55 30 66 12 S86 36 100 8 V56 H0 Z" fill="url(#sg-${color.replace('#','')})"/><path d="M0 45 C12 20 22 36 34 22 S55 30 66 12 S86 36 100 8" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/></svg>`;}
function metricCard(type,label,value,delta,color){return `<div class="dash-card" style="--accent:${color};--shadow:${color}55;--glow:${color}22"><div class="dash-ico">${iconSvg(type)}</div><div class="dash-card-label">${label}</div><div class="dash-value">${value}</div><div class="dash-delta ${delta.includes('+')?'up':''}">${delta.includes('+')?'up':'-'} <span>${esc(delta)}</span></div><div class="dash-spark">${sparkline(color)}</div></div>`;}
function dashboardSeries(range=dashboardRange){return { '7D':{pts:[37,55,47,63,50,75,74],labels:['Sep 21','Sep 22','Sep 23','Sep 24','Sep 25','Sep 26','Today']}, '30D':{pts:[28,34,31,46,42,58,62,55,71,78],labels:['W1','W2','W3','W4','W5','W6','W7','W8','W9','Today']}, '3M':{pts:[22,35,41,38,52,68,63,76,84,88,81,92],labels:['Jul 1','Jul 15','Aug 1','Aug 15','Sep 1','Sep 15','Today']}, '1Y':{pts:[18,24,31,29,45,52,61,58,72,79,86,93],labels:['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep']} }[range]||dashboardSeries('7D');}
function dashboardChart(range=dashboardRange){const series=dashboardSeries(range),pts=series.pts,w=720,h=230,max=100;const step=w/(pts.length-1);const path=pts.map((v,i)=>`${i?'L':'M'} ${Math.round(i*step)} ${Math.round(h-(v/max*h))}`).join(' ');const fill=`${path} L ${w} ${h} L 0 ${h} Z`;return `<div class="dash-chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="dashArea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2f7bff" stop-opacity=".45"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></linearGradient></defs>${[0,25,50,75,100].map(v=>`<line x1="0" x2="${w}" y1="${h-(v/max*h)}" y2="${h-(v/max*h)}" stroke="#223452" stroke-width="1"/>`).join('')}${pts.map((_,i)=>`<line x1="${i*step}" x2="${i*step}" y1="0" y2="${h}" stroke="#1d2d49" stroke-width="1"/>`).join('')}<path d="${fill}" fill="url(#dashArea)"/><path d="${path}" fill="none" stroke="#2f7bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${w}" cy="${h-(pts.at(-1)/max*h)}" r="6" fill="#fff" stroke="#2f7bff" stroke-width="4"/></svg></div><div class="dash-chart-labels">${series.labels.map(x=>`<span>${x}</span>`).join('')}</div>`;}

function renderDashboard(p){const counts={projects:data.projects.length,insights:data.insights.length,clients:data.clients.length,team:data.team.length,testimonials:data.testimonials.length};const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;let acc=0;const pct=Object.values(counts).map(v=>{acc+=v/total*100;return `${acc}%`;});const recent=(data.projects||[]).slice().sort(sortByOrder).slice(0,3);const activities=[...(data.projects||[]).slice(0,1).map(x=>['projects','Project updated',x.title||'Project','4h ago','#2563eb']),...(data.clients||[]).slice(0,1).map(x=>['clients','New client added',x.name||'Client','2h ago','#14b8a6']),...(data.testimonials||[]).slice(0,1).map(x=>['testimonials','New testimonial received',x.name||'Client','6h ago','#9333ea']),...(data.team||[]).slice(0,1).map(x=>['team','Team member added',x.name||'Team','1d ago','#f59e0b'])];const today=new Intl.DateTimeFormat('en',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(new Date());p.innerHTML=`<div class="dashboard-shell"><div class="dash-hero"><div><h1 class="dash-title">Welcome back, ${esc((currentAdmin?.name||'Sakin').split(' ')[0])}!</h1><p class="dash-kicker">Here is what is happening with your platform today.</p></div><div class="dash-date">${iconSvg('clock')} ${today}</div></div><div class="dash-metrics">${metricCard('projects','Projects',counts.projects,'+2 this month','#2f7bff')}${metricCard('insights','Insights',counts.insights,'No change','#7c3aed')}${metricCard('clients','Clients',counts.clients,'+1 this month','#14b8a6')}${metricCard('team','Team',counts.team,'No change','#f59e0b')}${metricCard('testimonials','Testimonials',counts.testimonials,'No change','#ec4899')}</div><div class="dash-main-grid"><section class="dash-panel"><div class="dash-panel-head"><div class="dash-panel-title"><div class="dash-ico" style="--accent:#1d4ed8">${iconSvg('chart')}</div><div><h3>Website Stats</h3><p>Overall performance and traffic</p></div></div><div class="dash-tabs">${['7D','30D','3M','1Y'].map(range=>`<button type="button" class="${dashboardRange===range?'active':''}" onclick="setDashboardRange('${range}')">${range}</button>`).join('')}</div></div>${dashboardChart()}</section><section class="dash-panel"><div class="dash-panel-head"><div class="dash-panel-title"><div class="dash-ico" style="--accent:#1d4ed8">${iconSvg('chart')}</div><div><h3>Content Distribution</h3><p>Total content across categories</p></div></div></div><div class="dash-donut-wrap"><div class="dash-donut" data-total="${total}" style="--p1:${pct[0]};--p2:${pct[1]};--p3:${pct[2]};--p4:${pct[3]}"></div><div class="dash-legend">${[['Projects',counts.projects,'#2f7bff'],['Insights',counts.insights,'#5b7cfa'],['Clients',counts.clients,'#22c7a7'],['Team',counts.team,'#f6a83b'],['Testimonials',counts.testimonials,'#b14bdf']].map(([label,value,color])=>`<div class="dash-legend-row"><span class="legend-dot" style="--dot:${color}"></span><span>${label}</span><strong>${value}</strong><span>${Math.round(value/total*100)}%</span></div>`).join('')}</div></div></section></div><div class="dash-bottom-grid"><section class="dash-panel"><div class="dash-panel-head"><div class="dash-panel-title"><div class="dash-ico" style="--accent:#2563eb">${iconSvg('projects')}</div><h3>Recent Projects</h3></div><button class="btn secondary" onclick="showPage('projects')">View all</button></div><div class="dash-list">${recent.length?recent.map((x,i)=>`<div class="dash-list-row"><img class="dash-thumb" src="${esc(mediaUrl(x.img||''))}" onerror="this.style.display='none'"><div><strong>${esc(x.title||'Untitled')}</strong><p class="muted">${esc(x.category||'Project')}</p></div><span class="dash-status">${i===0?'Active':i===1?'In Progress':'Completed'}</span></div>`).join(''):'<p class="muted">No projects added yet.</p>'}</div></section><section class="dash-panel"><div class="dash-panel-head"><div class="dash-panel-title"><div class="dash-ico" style="--accent:#2563eb">${iconSvg('clock')}</div><h3>Late function renderCollection(p,type){ const rows = (data[type]||[]).sort(sortByOrder); if(type==='projects') return renderProjectsCollection(p,rows); p.innerHTML = `<div class="toolbar"><div><h2>${title(type)}</h2><p class="muted">Add, edit, hide/show and delete records from MongoDB.</p></div><button class="btn primary" onclick="openModal('${type}')">+ Add ${title(type)}</button></div>${rows.length?`<div class="cards">${rows.map(itemCard(type)).join('')}</div>`:`<div class="empty">No ${title(type)} added yet.</div>`}`; }
function sortByOrder(a,b){ const ao=Number.isFinite(Number(a.order))?Number(a.order):999999,bo=Number.isFinite(Number(b.order))?Number(b.order):999999; return ao-bo || new Date(b.createdAt||0)-new Date(a.createdAt||0); }
function renderProjectsCollection(p,rows){ p.innerHTML = `<div class="toolbar"><div><h2>Projects</h2><p class="muted">Drag project cards to choose which projects appear first on the website.</p></div><button class="btn primary" onclick="openModal('projects')">+ Add Projects</button></div><p class="project-sort-note">Top 3 projects in this list are shown first on the homepage. Drag a card, drop it in the right position, and the order saves automatically.</p>${rows.length?`<div class="project-sort-grid" id="projectSortGrid">${rows.map(projectSortCard).join('')}</div>`:`<div class="empty">No Projects added yet.</div>`}`; setupProjectDragSort(); }
function projectSortCard(item,index){ return `<div class="card project-sort-card" draggable="true" data-id="${item._id}"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="row"><button class="drag-handle" type="button" title="Drag to reorder" aria-label="Drag to reorder">::</button><span class="order-badge ${index<3?'top-three-badge':''}">${index<3?'Top ':''}#${index+1}</span></div><span class="pill ${item.visible!==false?'on':''}">${item.visible!==false?'Visible':'Hidden'}</span></div>${imageField(item)}<h3>${esc(item.title||'Untitled')}</h3><p class="muted">${esc(item.category||item.desc||'')}</p><a class="card-project-link" href="project.html?id=${encodeURIComponent(item._id)}" target="_blank">View project page</a>${item.demoUrl?`<span class="url-status" style="margin-left:8px">Demo ready</span>`:``}<div class="row" style="margin-top:14px"><button class="btn secondary" onclick="openModal('projects','${item._id}')">Edit</button><button class="btn secondary" onclick="toggleVisible('projects','${item._id}',${item.visible===false})">${item.visible===false?'Show':'Hide'}</button><button class="btn danger" onclick="removeItem('projects','${item._id}')">Delete</button></div></div>`; }
function setupProjectDragSort(){ const grid=$('projectSortGrid'); if(!grid)return; let dragged=null; grid.querySelectorAll('.project-sort-card').forEach(card=>{ card.addEventListener('dragstart',e=>{dragged=card;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',card.dataset.id);}); card.addEventListener('dragend',()=>{card.classList.remove('dragging');grid.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));}); card.addEventListener('dragover',e=>{e.preventDefault();const target=e.currentTarget;if(!dragged||target===dragged)return;target.classList.add('drop-target');const rect=target.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;if(after)target.after(dragged);else target.before(dragged);}); card.addEventListener('dragleave',e=>e.currentTarget.classList.remove('drop-target')); card.addEventListener('drop',async e=>{e.preventDefault();grid.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));await saveProjectOrder();}); }); }
async function saveProjectOrder(){ const grid=$('projectSortGrid'); if(!grid)return; const items=[...grid.querySelectorAll('.project-sort-card')].map((card,index)=>({id:card.dataset.id,order:index})); if(!items.length)return; try{await api('/projects/reorder',{method:'POST',body:JSON.stringify({items})}); data.projects=items.map(item=>{const row=(data.projects||[]).find(p=>p._id===item.id);return row?{...row,order:item.order}:row;}).filter(Boolean); notify('Project order saved'); render();}catch(err){alert(err.message); await loadAll();} }

const projectCategories=['IoT','Web Development','Android App','iOS App','AI / ML','Desktop App','Blockchain','Game Development','Other'];
function projectForm(item={}){const id=item._id||'',visible=item.visible!==false,order=item.order??data.projects.length;const options=projectCategories.map(c=>`<option value="${esc(c)}" ${item.category===c?'selected':''}>${esc(c)}</option>`).join('');return `<div class="form-section"><div class="form-section-title"><span>01</span>Project details</div><div class="field"><label>Project title *</label><input name="title" required value="${esc(item.title)}" placeholder="e.g. Smart irrigation system"></div><div class="grid2"><div class="field"><label>Category *</label><select name="category" required onchange="toggleIotFields(this.value)"><option value="" disabled ${!item.category?'selected':''}>Select project type</option>${options}</select><small class="field-help">Choose the type of project being uploaded.</small></div><div class="field"><label>Technology tags</label><input name="tags" value="${esc((item.tags||[]).join(', '))}" placeholder="React, Arduino, Node.js"><small class="field-help">Separate technologies with commas.</small></div></div><div class="field"><label>Project description</label><textarea name="desc" style="min-height:150px" placeholder="Explain the challenge, solution and outcome...">${esc(item.desc)}</textarea></div></div><div class="form-section"><div class="form-section-title"><span>02</span>Images</div><div class="grid2"><div class="field"><label>Cover image URL</label><input name="img" value="${esc(item.img)}" placeholder="https://..."></div><div class="field"><label>Upload cover image</label><input type="file" id="upload-projects" accept="image/*"><small class="field-help">Used on the project card and detail page.</small></div></div><div class="field"><label>Gallery image URLs</label><textarea name="images" placeholder="https://image-1.jpg, https://image-2.jpg">${esc((item.images||[]).join(', '))}</textarea></div></div><div class="form-section" id="iotFields" style="display:${item.category==='IoT'?'block':'none'}"><div class="form-section-title"><span>03</span>IoT model & real video</div><div class="grid2"><div class="field"><label>IoT model photo URL</label><input id="modelImage" name="modelImage" value="${esc(item.modelImage)}" placeholder="https://..."></div><div class="field"><label>Upload model photo</label><input type="file" accept="image/*" onchange="uploadModelImage(this)"><small class="field-help">Upload a clear photo of the real hardware/model.</small></div></div><div class="field"><label>Real project video link *</label><input id="videoUrl" name="videoUrl" type="url" value="${esc(item.videoUrl)}" placeholder="YouTube, Vimeo, or direct MP4 link"><small class="field-help">The video will play on the project detail page.</small></div></div><div class="form-section"><div class="form-section-title"><span>04</span>Publishing</div><div class="field"><label>Live demo URL</label><input name="demoUrl" type="url" value="${esc(item.demoUrl)}" placeholder="https://your-live-project.com"></div><div class="grid2"><div class="field"><label>Creator name *</label><input name="creatorName" required value="${esc(item.creatorName)}"></div><div class="field"><label>Creator portfolio URL *</label><input name="creatorPortfolio" type="url" required value="${esc(item.creatorPortfolio)}" placeholder="https://..."></div></div><div class="grid2"><div class="field"><label>Order</label><input name="order" type="number" value="${order}"></div><div class="field"><label>Visible</label><select name="visible"><option value="true" ${visible?'selected':''}>Visible</option><option value="false" ${!visible?'selected':''}>Hidden</option></select></div></div></div><input type="hidden" name="_id" value="${id}"><div class="project-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">${id?'Save changes':'Create project'}</button></div>`}
function setupProjectGalleryField(){const textarea=document.querySelector('textarea[name="images"]');if(!textarea||document.getElementById('projectGalleryUpload'))return;textarea.id='projectGalleryImages';textarea.insertAdjacentHTML('afterend','<small class="field-help">These images rotate on the project card while hovering.</small><div class="field" style="margin-top:12px"><label>Upload gallery images</label><input id="projectGalleryUpload" type="file" accept="image/*" multiple onchange="uploadProjectGalleryImages(this)"><small class="field-help">Select multiple images to append them to the gallery.</small></div>');}
window.toggleIotFields=function(category){const box=$('iotFields'),video=$('videoUrl');if(box)box.style.display=category==='IoT'?'block':'none';if(video)video.required=category==='IoT';setupProjectGalleryField();};
window.uploadModelImage=async function(input){try{if(!input.files?.[0])return;input.disabled=true;$('modelImage').value=await uploadImageFile(input.files[0]);notify('Model photo uploaded');}catch(err){alert(err.message)}finally{input.disabled=false}};
window.uploadProjectGalleryImages=async function(input){try{const files=[...(input.files||[])];if(!files.length)return;input.disabled=true;const uploaded=[];for(const file of files)uploaded.push(await uploadImageFile(file));const textarea=$('projectGalleryImages')||document.querySelector('textarea[name="images"]');const existing=(textarea.value||'').split(',').map(x=>x.trim()).filter(Boolean);textarea.value=[...existing,...uploaded].join(', ');notify(`${uploaded.length} gallery image${uploaded.length>1?'s':''} uploaded`);}catch(err){alert(err.message)}finally{input.disabled=false;input.value='';}};
window.uploadInsightImage=async function(input){try{if(!input.files?.[0])return;input.disabled=true;$('insightImage').value=await uploadImageFile(input.files[0]);notify('Insight image uploaded');}catch(err){alert(err.message)}finally{input.disabled=false}};
window.openModal = function(type,id=''){ editing={type,id}; const item=id?(data[type]||[]).find(x=>x._id===id):{}; if(type==='projects'&&item?.category&&!projectCategories.includes(item.category))projectCategories.push(item.category); $('modalTitle').textContent=(id?'Edit ':'Add ')+title(type); $('modalForm').innerHTML=type==='admins'?adminForm(item||{}):type==='projects'?projectForm(item||{}):formFor(type,item||{}); $('modal').querySelector('.modal-card').classList.toggle('project-modal',type==='projects'||type==='admins'||type==='blogs'); $('modal').classList.add('open'); if(type==='projects')toggleIotFields(item?.category||''); }
window.closeModal = function(){ $('modal').classList.remove('open'); editing=null; }
$('modalForm').addEventListener('submit', async e => { e.preventDefault(); const f=e.currentTarget,type=editing.type,submit=f.querySelector('button:not([type]),button[type="submit"]'); if(submit){submit.disabled=true;submit.dataset.label=submit.textContent;submit.textContent='Saving...';} try { const obj=Object.fromEntries(new FormData(f).entries()); delete obj._id; if(type==='admins'){ obj.active=obj.active==='true'; if(!obj.password) delete obj.password; } else { obj.visible=obj.visible==='true'; obj.order=Number(obj.order||0); obj.tags=obj.tags?obj.tags.split(',').map(x=>x.trim()).filter(Boolean):[]; if(!['projects','blogs'].includes(type)) delete obj.tags; obj.images=obj.images?obj.images.split(',').map(x=>x.trim()).filter(Boolean):[]; if(type!=='projects') delete obj.images; if(obj.readTime!==undefined)obj.readTime=Number(obj.readTime||5); if(obj.rating!==undefined)obj.rating=Number(obj.rating||0); if(obj.lat!==undefined)obj.lat=Number(obj.lat); if(obj.lng!==undefined)obj.lng=Number(obj.lng); if(obj.clientsCount!==undefined)obj.clientsCount=Number(obj.clientsCount||1); const fileUrl=await uploadFile(`upload-${type}`); if(fileUrl){if(type==='projects')obj.img=fileUrl;if(type==='clients')obj.logo=fileUrl;if(type==='blogs')obj.coverImage=fileUrl;} } const ep=endpoints[type]; const saved=editing.id?await api(`/${ep}/${editing.id}`,{method:'PUT',body:JSON.stringify(obj)}):await api(`/${ep}`,{method:'POST',body:JSON.stringify(obj)}); if(type==='projects'&&(saved.creatorName!==obj.creatorName||saved.creatorPortfolio!==obj.creatorPortfolio))throw new Error('Creator details were not saved by the backend. Please try again after the backend deployment finishes.'); closeModal(); await loadAll(); notify('Saved'); } catch(err){ alert(err.message); } finally {if(submit){submit.disabled=false;submit.textContent=submit.dataset.label||'Save';}} });
window.toggleVisible = async function(type,id,show){ await api(`/${endpoints[type]}/${id}`, {method:'PUT',body:JSON.stringify({ visible: show })}); await loadAll(); }
window.removeItem = async function(type,id){ if(!confirm('Delete this item permanently?')) return; await api(`/${endpoints[type]}/${id}`, {method:'DELETE'}); await loadAll(); }
window.toggleAdminPassword=function(){const input=$('adminPassword');if(input)input.type=input.type==='password'?'text':'password';};
function renderAdmins(p){ const canManage=['owner','admin'].includes(currentAdmin?.role); if(data.adminUsersAvailable===false){p.innerHTML='<div class="empty"><h3 style="margin-bottom:8px">Employees update pending</h3><p class="muted">Deploy the latest backend version to enable employee access control.</p></div>';return;} const q=employeeQuery.toLowerCase().trim(); const rows=(data.admins||[]).filter(a=>!q||[a.name,a.email,a.employeeId,a.position,a.role].some(v=>String(v||'').toLowerCase().includes(q))); p.innerHTML=`<div class="toolbar"><div><h2>Employees</h2><p class="muted">Decide who can access the admin panel, update passwords, positions and roles.</p></div>${canManage?'<button class="btn primary" onclick="openModal(\'admins\')">+ Add Employee</button>':''}</div><div class="card employee-search-card"><div class="field" style="margin:0"><label>Search employee</label><input id="employeeSearch" value="${esc(employeeQuery)}" placeholder="Search by name, email, employee ID, position or role"></div><div class="employee-count"><strong>${rows.length}</strong><span>matched</span></div></div>${rows.length?`<div class="cards employee-grid">${rows.map(employeeCard(canManage)).join('')}</div>`:'<div class="empty">No employees found.</div>'}`; const search=$('employeeSearch'); if(search){search.focus(); search.setSelectionRange(search.value.length,search.value.length); search.addEventListener('input',e=>{employeeQuery=e.target.value;renderAdmins(p);});} }
function employeeCard(canManage){return a=>{const protectedOwner=String(a.email||'').toLowerCase()==='alishafaq782@gmail.com';return `<div class="card employee-card"><div class="admin-account-card"><div class="admin-avatar">${esc((a.name||'E').slice(0,1).toUpperCase())}</div><div><h3>${esc(a.name)}</h3><p class="muted">${esc(a.position||'Employee')}</p></div></div><div class="employee-meta"><span>ID</span><strong>${esc(a.employeeId||'-')}</strong></div><p class="muted">${esc(a.email)}</p><div class="row" style="margin-top:12px"><span class="pill ${a.active!==false?'on':''}">${a.active!==false?'Access allowed':'Blocked'}</span><span class="pill">${protectedOwner?'default owner':esc(a.role||'employee')}</span></div><div class="row" style="margin-top:14px">${canManage||String(currentAdmin?.id)===String(a._id)?`<button class="btn secondary" onclick="openModal('admins','${a._id}')">Edit</button>`:''}${canManage&&String(currentAdmin?.id)!==String(a._id)&&!protectedOwner?`<button class="btn ${a.active!==false?'danger':'green'}" onclick="setEmployeeAccess('${a._id}',${a.active===false})">${a.active!==false?'Block':'Allow'}</button><button class="btn danger" onclick="removeAdmin('${a._id}')">Kick</button>`:''}</div></div>`;};}
window.setEmployeeAccess=async function(id,active){try{await api(`/admins/${id}`,{method:'PUT',body:JSON.stringify({active})});await loadAll();notify(active?'Access allowed':'Access blocked');}catch(err){alert(err.message);}};
window.removeAdmin=async function(id){ if(!confirm('Kick this employee and remove their admin panel access?'))return; try{await api(`/admins/${id}`,{method:'DELETE'});await loadAll();notify('Employee kicked');}catch(err){alert(err.message);} };

const contactDefaults={formTitle:'Tell us about your project',formSubtitle:'Fill in the details below and our team will get back to you within one business day.',sidebarLabel:'Contact details',teamTitle:'Meet the team',teamSubtitle:'Ready to discuss your project',teamStatus:'Team is online · Responds in < 24 h',officesTitle:'Our Offices',methodsTitle:'Other Ways to Reach Us',email:'hello@sakinzo.com',emailLabel:'Email us directly',linkedinUrl:'https://www.linkedin.com/company/sakinzo',linkedinLabel:'Connect on LinkedIn',footerCtaTitle:'Ready to start your project?',footerCtaSubtitle:'Get a free consultation from our experts.',footerCtaButton:'Get in touch →'};
function contactSettings(){return {...contactDefaults,...(data.contactPage||{})};}
function renderContactPage(p){const c=contactSettings(),offices=(data.contactOffices||[]).sort(sortByOrder);p.innerHTML=`<div class="toolbar"><div><h2>Contact Page</h2><p class="muted">Manage contact page copy, office locations, contact methods and leads from one place.</p></div><a class="btn secondary" href="contactus.html" target="_blank">Preview Contact Page</a></div><div class="contact-admin-grid"><form class="card contact-settings-card" id="contactSettingsForm"><h3>Page Content</h3><p class="muted" style="margin-bottom:16px">These fields update the visible contact page text.</p><div class="grid2"><div class="field"><label>Form title</label><input name="formTitle" value="${esc(c.formTitle)}"></div><div class="field"><label>Sidebar label</label><input name="sidebarLabel" value="${esc(c.sidebarLabel)}"></div></div><div class="field"><label>Form subtitle</label><textarea name="formSubtitle">${esc(c.formSubtitle)}</textarea></div><div class="grid2"><div class="field"><label>Team card title</label><input name="teamTitle" value="${esc(c.teamTitle)}"></div><div class="field"><label>Team card subtitle</label><input name="teamSubtitle" value="${esc(c.teamSubtitle)}"></div></div><div class="grid2"><div class="field"><label>Team status</label><input name="teamStatus" value="${esc(c.teamStatus)}"></div><div class="field"><label>Offices title</label><input name="officesTitle" value="${esc(c.officesTitle)}"></div></div><div class="grid2"><div class="field"><label>Contact methods title</label><input name="methodsTitle" value="${esc(c.methodsTitle)}"></div><div class="field"><label>Email address</label><input name="email" type="email" value="${esc(c.email)}"></div></div><div class="grid2"><div class="field"><label>Email label</label><input name="emailLabel" value="${esc(c.emailLabel)}"></div><div class="field"><label>LinkedIn label</label><input name="linkedinLabel" value="${esc(c.linkedinLabel)}"></div></div><div class="field"><label>LinkedIn URL</label><input name="linkedinUrl" type="url" value="${esc(c.linkedinUrl)}"></div><div class="grid2"><div class="field"><label>Footer CTA title</label><input name="footerCtaTitle" value="${esc(c.footerCtaTitle)}"></div><div class="field"><label>Footer CTA button</label><input name="footerCtaButton" value="${esc(c.footerCtaButton)}"></div></div><div class="field"><label>Footer CTA subtitle</label><input name="footerCtaSubtitle" value="${esc(c.footerCtaSubtitle)}"></div><div class="row" style="justify-content:flex-end"><button class="btn primary">Save Contact Page</button></div></form><div class="contact-side-stack"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:14px"><div><h3>Offices</h3><p class="muted">Shown in the contact sidebar and footer.</p></div><button class="btn primary" onclick="openModal('contactOffices')">+ Add Office</button></div>${offices.length?`<div class="compact-list">${offices.map(o=>`<div class="compact-item"><div><strong>${esc(o.name||'Office')}</strong><p class="muted">${esc(o.address||o.country||'')}</p></div><span class="pill ${o.visible!==false?'on':''}">${o.visible!==false?'Visible':'Hidden'}</span><div class="row"><button class="btn secondary" onclick="openModal('contactOffices','${o._id}')">Edit</button><button class="btn secondary" onclick="toggleVisible('contactOffices','${o._id}',${o.visible===false})">${o.visible===false?'Show':'Hide'}</button><button class="btn danger" onclick="removeItem('contactOffices','${o._id}')">Delete</button></div></div>`).join('')}</div>`:`<div class="empty">No offices added yet.</div>`}</div><div class="card"><h3>Quick Stats</h3><div class="contact-metrics"><div><strong>${data.contactOffices.length}</strong><span>Offices</span></div><div><strong>${data.submissions.length}</strong><span>Leads</span></div><div><strong>${(data.team||[]).filter(x=>x.visible!==false).length}</strong><span>Team shown</span></div></div></div></div></div><div class="contact-leads-panel">${renderSubmissionsMarkup()}</div>`;$('contactSettingsForm')?.addEventListener('submit',saveContactPageSettings);}
function renderSubmissionsMarkup(){const rows=data.submissions||[];return `<div class="toolbar contact-leads-toolbar"><div><h2>Contact Leads</h2><p class="muted">Messages from contactus.html and the footer form.</p></div><button class="btn secondary" onclick="loadAll()">Refresh</button></div>${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Source</th><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Message</th><th>Attachment</th><th>Reply</th><th>Action</th></tr></thead><tbody>${rows.map(s=>{const wa=whatsappUrl(s.phone);return `<tr><td>${esc(fmtDate(s.createdAt))}</td><td>${esc(s.source||'-')}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.phone)}</td><td>${esc(s.company)}</td><td>${esc(s.desc).slice(0,120)}</td><td>${s.attachmentUrl?`<a href="${mediaUrl(s.attachmentUrl)}" target="_blank" style="color:#60a5fa">Open</a>`:'-'}</td><td><div class="row"><a class="btn secondary" href="${mailtoUrl(s)}">Email</a>${wa?`<a class="btn green" href="${wa}" target="_blank">WhatsApp</a>`:`<span class="pill">No phone</span>`}</div></td><td><button class="btn danger" onclick="deleteSubmission('${s._id}')">Delete</button></td></tr>`;}).join('')}</tbody></table>`:`<div class="empty">No submissions yet.</div>`}`;}
async function saveContactPageSettings(e){e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;button.dataset.label=button.textContent;button.textContent='Saving...';try{const payload=Object.fromEntries(new FormData(form).entries());data.contactPage=await api('/contact-page',{method:'PUT',body:JSON.stringify(payload)});notify('Contact page saved');render();}catch(err){alert(err.message);}finally{button.disabled=false;button.textContent=button.dataset.label||'Save Contact Page';}}

function renderSections(p){ const keys=['hero','why','clients','whatwedo','projects','services','cases','map','feedback','insights']; const map={}; (data.sections||[]).forEach(s=>map[s.key]=s.enabled); p.innerHTML=`<div class="toolbar"><div><h2>Sections</h2><p class="muted">Turn website sections on/off.</p></div></div><div class="cards">${keys.map(k=>`<div class="card"><h3>${k}</h3><p class="muted">Current: ${map[k]!==false?'Visible':'Hidden'}</p><button class="btn ${map[k]!==false?'danger':'green'}" onclick="toggleSectionVisibility('${k}',${map[k]===false})">${map[k]!==false?'Hide':'Show'}</button></div>`).join('')}</div>`; }
function renderWhatWeDoServices(p){ const rows=data.whatWeDoServices||[]; p.innerHTML=`<div class="toolbar"><div><h2>What We Do Services</h2><p class="muted">Turn individual homepage service cards on or off.</p></div></div><div class="cards">${rows.map(s=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(s.label)}</h3><span class="pill ${s.enabled!==false?'on':''}">${s.enabled!==false?'Visible':'Hidden'}</span></div><p class="muted">Homepage service card</p><button style="margin-top:14px" class="btn ${s.enabled!==false?'danger':'green'}" onclick="toggleWhatWeDoService('${s.key}',${s.enabled===false})">${s.enabled!==false?'Turn Off':'Turn On'}</button></div>`).join('')}</div>`; }
window.toggleWhatWeDoService=async function(key,enabled){ await api(`/what-we-do-services/${key}`,{method:'PUT',body:JSON.stringify({enabled})}); await loadAll(); }
window.toggleSectionVisibility = async function(key,enabled){ await api(`/sections/${key}`, {method:'PUT',body:JSON.stringify({enabled})}); await loadAll(); }
function renderSubmissions(p){ const rows=data.submissions||[]; p.innerHTML=`<div class="toolbar"><div><h2>Submissions</h2><p class="muted">Leads from contactus.html and the index footer contact form.</p></div><button class="btn secondary" onclick="loadAll()">Refresh</button></div>${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Source</th><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Message</th><th>Attachment</th><th>Reply</th><th>Action</th></tr></thead><tbody>${rows.map(s=>{ const wa=whatsappUrl(s.phone); return `<tr><td>${esc(fmtDate(s.createdAt))}</td><td>${esc(s.source || '-')}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.phone)}</td><td>${esc(s.company)}</td><td>${esc(s.desc).slice(0,120)}</td><td>${s.attachmentUrl?`<a href="${mediaUrl(s.attachmentUrl)}" target="_blank" style="color:#60a5fa">Open</a>`:'-'}</td><td><div class="row"><a class="btn secondary" href="${mailtoUrl(s)}">Email</a>${wa?`<a class="btn green" href="${wa}" target="_blank">WhatsApp</a>`:`<span class="pill">No phone</span>`}</div></td><td><button class="btn danger" onclick="deleteSubmission('${s._id}')">Delete</button></td></tr>`; }).join('')}</tbody></table>`:`<div class="empty">No submissions yet.</div>`}`; }
window.deleteSubmission = async function(id){ if(!confirm('Delete submission?')) return; await api(`/submissions/${id}`, {method:'DELETE'}); await loadAll(); }
boot();
</script>
