<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog | Sakinzo</title>
  <meta name="description" content="Sakinzo blog - practical ideas on AI, IoT, web development, product strategy and digital transformation.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#061326">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#071426;--blue:#1673ff;--text:#13233f;--muted:#66758b;--line:#dfe7f1;--soft:#f4f7fb}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Manrope,sans-serif;color:var(--text);background:#fff;line-height:1.65}a{text-decoration:none;color:inherit}
    .hdr{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,18,40,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .hdr-inner{max-width:1360px;margin:0 auto;padding:0 40px;height:68px;display:flex;align-items:center;gap:8px}.logo{display:flex;align-items:center;gap:10px;margin-right:24px;flex-shrink:0}.logo-txt{font-size:21px;font-weight:700;color:#fff}.logo-txt span{color:#1673ff;font-weight:800}.hdr nav{display:flex;align-items:center;flex:1}.ndrop{position:relative}.nbtn{background:none;border:0;font-family:inherit;font-size:14px;font-weight:500;color:rgba(255,255,255,.85);padding:8px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}.nbtn:hover,.ndrop.open .nbtn{color:#fff;background:rgba(255,255,255,.09)}.drop{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--text);min-width:260px;padding:8px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.15)}.ndrop:hover .drop,.ndrop.open .drop{display:block}.drop a{display:block;padding:9px 14px;border-radius:8px;font-size:13.5px}.drop a:hover{background:#edf4ff;color:var(--blue)}.hdr-right{margin-left:auto;display:flex;align-items:center;gap:20px}.btn-git{background:#1673ff;color:#fff;border-radius:100px;padding:11px 26px;font-size:14px;font-weight:700}.hamburger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:40px;height:40px;margin-left:auto;background:none;border:0}.hamburger span{width:24px;height:2px;background:#fff;border-radius:2px;transition:.3s}.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}.hamburger.open span:nth-child(2){opacity:0}.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .mobile-menu{display:none;position:fixed;top:68px;left:0;right:0;bottom:0;background:rgba(4,12,28,.98);z-index:999;overflow:auto;padding:16px 0 40px}.mobile-menu.open{display:block}.mob-item{border-bottom:1px solid rgba(255,255,255,.07)}.mob-link{display:flex;justify-content:space-between;padding:16px 24px;color:rgba(255,255,255,.88);cursor:pointer}.mob-sub{display:none;background:rgba(255,255,255,.04)}.mob-sub.open{display:block}.mob-sub a{display:block;padding:12px 40px;color:rgba(255,255,255,.65)}.mob-cta{margin:24px;display:block;background:#1673ff;color:#fff;text-align:center;padding:16px;border-radius:100px;font-weight:700}
    .hero{padding:154px 28px 82px;background:radial-gradient(circle at 82% 18%,rgba(22,115,255,.3),transparent 28%),linear-gradient(135deg,#061124,#0a2142);color:#fff}.wrap{max-width:1200px;margin:0 auto}.crumb{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:24px}.crumb a{color:#84b8ff}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#85b9ff;text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:800;margin-bottom:16px}.eyebrow:before{content:"";width:28px;height:2px;background:#1673ff}.hero h1{max-width:850px;font-size:clamp(42px,6vw,76px);line-height:1.04;letter-spacing:-.045em;margin-bottom:22px}.hero p{max-width:720px;color:rgba(255,255,255,.68);font-size:18px}
    .section{padding:80px 28px}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}.toolbar h2{font-size:clamp(28px,4vw,46px);line-height:1.12;letter-spacing:-.035em}.toolbar p{color:var(--muted);max-width:620px;margin-top:10px}.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.post-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 16px 38px rgba(16,44,84,.06);transition:.25s}.post-card:hover{transform:translateY(-4px);border-color:#b9d4ff}.post-cover{height:205px;background:linear-gradient(135deg,#0b1d38,#1673ff);overflow:hidden}.post-cover img{width:100%;height:100%;object-fit:cover;display:block}.post-body{padding:24px}.post-meta{display:flex;gap:9px;flex-wrap:wrap;color:#64748b;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.post-card h3{font-size:22px;line-height:1.2;margin:13px 0 10px}.post-card p{color:var(--muted);font-size:14px}.read-link{display:inline-flex;margin-top:18px;color:#1673ff;font-weight:800}.empty{border:1px dashed var(--line);border-radius:18px;padding:42px;text-align:center;color:var(--muted);background:var(--soft)}
    .article{padding:146px 28px 80px}.article-shell{max-width:900px;margin:0 auto}.back{display:inline-flex;color:#1673ff;font-weight:800;margin-bottom:28px}.article-meta{display:flex;gap:10px;flex-wrap:wrap;color:#64748b;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}.article h1{font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-.045em;margin-bottom:18px}.article-excerpt{font-size:19px;color:var(--muted);margin-bottom:28px}.article-cover{width:100%;max-height:480px;object-fit:cover;border-radius:22px;margin:10px 0 36px;background:#eaf2ff}.article-content{font-size:18px;color:#24364f}.article-content p{margin:0 0 20px}.article-tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}.article-tags span{background:#eaf2ff;color:#1673ff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}
    .cta{padding:72px 28px;background:#0b1d38;color:#fff}.cta-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:30px}.cta h2{font-size:clamp(28px,4vw,44px);line-height:1.15}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:9px;font-weight:800;background:#1673ff;color:#fff}.site-footer{background:#050d19;color:rgba(255,255,255,.5);padding:32px 28px}.footer-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:20px;font-size:13px}.footer-links{display:flex;gap:22px}
    @media(max-width:1024px){.hdr nav,.hdr-right{display:none}.hamburger{display:flex}.hdr-inner{padding:0 24px}.blog-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:700px){.hdr-inner{padding:0 20px}.hero{padding-top:124px}.section,.hero,.article,.cta{padding-left:18px;padding-right:18px}.blog-grid{grid-template-columns:1fr}.toolbar,.cta-inner,.footer-inner{align-items:flex-start;flex-direction:column}.article{padding-top:124px}}
  </style>
</head>
<body>
  <header class="hdr"><div class="hdr-inner"><a href="index.html" class="logo"><svg width="36" height="36" viewBox="0 0 36 36" fill="none"><path d="M6 8 L18 2 L30 8 L26 14 L18 11 L10 14 Z" fill="#1673FF"/><path d="M6 8 L10 14 L6 20 L18 34 L30 20 L26 14 L18 11 L10 14 Z" fill="#1673FF" opacity=".85"/><path d="M10 14 L18 11 L26 14 L18 28 Z" fill="rgba(255,255,255,0.35)"/></svg><span class="logo-txt">Sakin<span>.zo</span></span></a><nav id="desktopNav"></nav><div class="hdr-right"><a href="contactus.html#form-section" class="btn-git">Get in touch</a></div><button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button></div></header>
  <div class="mobile-menu" id="mobileMenu"></div>
  <main id="app"><section class="hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a> / Insights</div><div class="eyebrow">Blog</div><h1>Ideas for building better digital products</h1><p>Practical perspectives on product strategy, engineering, AI, IoT and business transformation from the Sakinzo team.</p></div></section><section class="section"><div class="wrap"><div class="empty">Loading blog posts...</div></div></section></main>
  <footer class="site-footer"><div class="footer-inner"><a class="logo-txt" href="index.html">Sakin<span>.zo</span></a><div class="footer-links"><a href="who-we-are.html">About</a><a href="careers.html">Careers</a><a href="blog.html">Blog</a><a href="contactus.html">Contact</a></div><span id="year"></span></div></footer>
  <script>
    const API_BASE = window.API_BASE || 'https://sakinzo.onrender.com/api';
    const API_ORIGIN = API_BASE.replace('/api','');
    const links={about:[['Who We Are','who-we-are.html'],['Careers','careers.html'],['Contacts','contactus.html'],['Leadership','leadership.html']],stories:[['Cloud ecosystem for EV charging','ev-charging.html'],['AI-Based Market Access Tool','market-access.html'],['Multi-currency Wallet','multi-currency-wallet.html'],['IoT Cloud Platform','iot-cloud-platform.html'],['Smart HVAC Monitoring with AI','smart-hvac.html']],services:[['IoT Development Services','iot-development.html'],['AI Development','ai-development.html'],['AI Agent Development','ai-agent-development.html'],['eCommerce Platform Development','ecommerce-development.html'],['Fintech Software Development','fintech-development.html'],['Blockchain Development','blockchain-development.html'],['Full-cycle Development','full-cycle-development.html']],insights:[['News','news.html'],['Opensource','opensource.html'],['Blog','blog.html']]};
    const esc=(v='')=>String(v).replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
    const mediaUrl=url=>url&&url.startsWith('/uploads/')?API_ORIGIN+url:url;
    const fmt=value=>value?new Date(value).toLocaleDateString('en',{month:'short',day:'2-digit',year:'numeric'}):'';
    const arrow='<svg viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    const drop=a=>`<div class="drop">${a.map(x=>`<a href="${x[1]}">${x[0]}</a>`).join('')}</div>`;
    document.getElementById('desktopNav').innerHTML=`<div class="ndrop"><button class="nbtn">About Us${arrow}</button>${drop(links.about)}</div><div class="ndrop"><button class="nbtn">Success Stories${arrow}</button>${drop(links.stories)}</div><div class="ndrop"><button class="nbtn">Services${arrow}</button>${drop(links.services)}</div><div class="ndrop"><button class="nbtn">Insights${arrow}</button>${drop(links.insights)}</div>`;
    document.getElementById('mobileMenu').innerHTML=Object.entries({About:links.about,'Success Stories':links.stories,Services:links.services,Insights:links.insights}).map(([name,items])=>`<div class="mob-item"><div class="mob-link" onclick="this.classList.toggle('active');this.nextElementSibling.classList.toggle('open')">${name}${arrow}</div><div class="mob-sub">${items.map(x=>`<a href="${x[1]}">${x[0]}</a>`).join('')}</div></div>`).join('')+`<a href="contactus.html#form-section" class="mob-cta">Get in touch</a>`;
    const ham=document.getElementById('hamburger'),mob=document.getElementById('mobileMenu');ham.addEventListener('click',()=>{ham.classList.toggle('open');mob.classList.toggle('open');document.body.style.overflow=mob.classList.contains('open')?'hidden':''});
    document.getElementById('year').textContent='(c) '+new Date().getFullYear()+' Sakinzo';
    function postCard(post){const cover=post.coverImage?`<img src="${esc(mediaUrl(post.coverImage))}" alt="${esc(post.title)}" loading="lazy">`:'';return `<article class="post-card"><a href="blog.html?slug=${encodeURIComponent(post.slug||post._id)}"><div class="post-cover">${cover}</div><div class="post-body"><div class="post-meta"><span>${esc(post.category||'Blog')}</span><span>${fmt(post.publishedAt)}</span><span>${post.readTime||5} min read</span></div><h3>${esc(post.title)}</h3><p>${esc(post.excerpt)}</p><span class="read-link">Read article -></span></div></a></article>`}
    function renderList(posts){document.getElementById('app').innerHTML=`<section class="hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a> / Insights</div><div class="eyebrow">Blog</div><h1>Ideas for building better digital products</h1><p>Practical perspectives on product strategy, engineering, AI, IoT and business transformation from the Sakinzo team.</p></div></section><section class="section"><div class="wrap"><div class="toolbar"><div><h2>Latest articles</h2><p>Fresh thinking from the people building real products, platforms and connected systems.</p></div></div>${posts.length?`<div class="blog-grid">${posts.map(postCard).join('')}</div>`:`<div class="empty">No published blogs yet. Add one from the admin panel.</div>`}</div></section><section class="cta"><div class="cta-inner"><h2>Have a challenge worth solving?</h2><a class="btn" href="contactus.html#form-section">Tell us about your project</a></div></section>`}
    function renderArticle(post){document.title=`${post.title} | Sakinzo Blog`;const paragraphs=String(post.body||'').split(/\n{2,}/).map(block=>`<p>${esc(block).replace(/\n/g,'<br>')}</p>`).join('');const cover=post.coverImage?`<img class="article-cover" src="${esc(mediaUrl(post.coverImage))}" alt="${esc(post.title)}">`:'';document.getElementById('app').innerHTML=`<article class="article"><div class="article-shell"><a class="back" href="blog.html"><- All blogs</a><div class="article-meta"><span>${esc(post.category||'Blog')}</span><span>${fmt(post.publishedAt)}</span><span>${post.readTime||5} min read</span><span>${esc(post.author||'Sakinzo Team')}</span></div><h1>${esc(post.title)}</h1><p class="article-excerpt">${esc(post.excerpt)}</p>${cover}<div class="article-content">${paragraphs}</div>${(post.tags||[]).length?`<div class="article-tags">${post.tags.map(tag=>`<span>${esc(tag)}</span>`).join('')}</div>`:''}</div></article>`}
    async function init(){try{const posts=await fetch(`${API_BASE}/blogs`).then(r=>r.ok?r.json():[]);const slug=new URLSearchParams(location.search).get('slug');if(slug){const post=posts.find(item=>String(item.slug||item._id)===slug);if(post)renderArticle(post);else renderList(posts);}else renderList(posts);}catch(error){document.querySelector('#app .wrap').innerHTML='<div class="empty">Unable to load blogs right now.</div>';console.error(error);}}
    init();
  </script>
</body>
</html>
