name: Deploy React website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /Sakin.zo/
          VITE_SITE_URL: https://sakinzo-work.github.io/Sakin.zo/
      - name: Prepare React route fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This repository also has a branch-based Pages publisher. Wait for it
      # before publishing dist so it cannot overwrite React with raw JSX.
      - name: Wait for automatic Pages publisher
        uses: actions/github-script@v8
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,
                head_sha: context.sha,
                per_page: 100,
              });
              const automatic = data.workflow_runs.find(run => run.name === 'pages build and deployment');
              if (automatic?.status === 'completed') {
                core.info('Automatic publisher finished; publishing the React build last.');
                return;
              }
              if (!automatic && attempt >= 2) {
                core.info('No automatic publisher is active.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Automatic Pages publisher did not finish in time.');
      - id: deployment
        uses: actions/deploy-pages@v4
